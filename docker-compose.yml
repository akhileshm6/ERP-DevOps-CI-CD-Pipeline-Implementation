# ERP DevOps CI/CD Pipeline — local development stack
# Owner: Vivek Anand (Containerisation & System Architecture)
#
# Restored from commit 21516668; commit 0ff40646 had overwritten this file
# with a copy of .github/workflows/ci.yml. Adds the named Postgres volume,
# DATABASE_URL wiring, healthchecks and ordered startup that the original lacked.

services:
  db:
    image: postgres:15-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume -> Postgres data survives `docker compose down`.
      - erp_pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first boot, in filename order.
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
    container_name: erp-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@db:5432/${POSTGRES_DB:-erp_db}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_VERSION: ${APP_VERSION:-dev}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      DEPLOY_API_TOKEN: ${DEPLOY_API_TOKEN:-local_deploy_token}
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./client
    container_name: erp-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:8080"
    depends_on:
      server:
        condition: service_started

volumes:
  erp_pgdata:
    name: erp_pgdata
